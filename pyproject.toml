[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "numcodecs-interp-ctx"
version = "0.1.0"
description = "Error-bounded codec for smooth gridded data using hierarchical interpolation prediction and context-mixing arithmetic coding for the `numcodecs` buffer compression API"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
dependencies = [
    "leb128~=1.0.8",
    "numcodecs>=0.13.0,<0.17",
    "numba>=0.60",
    "numcodecs-context-mixing~=0.1.0",
    "numcodecs-mask>=0.1.0",
    "numpy~=2.0",
    "typing-extensions~=4.6",
]

[dependency-groups]
dev = ["mypy~=1.14", "pytest~=8.3"]

[project.entry-points."numcodecs.codecs"]
"interp_ctx" = "numcodecs_interp_ctx:InterpolationContextMixingCodec"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"numcodecs_interp_ctx" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[[tool.mypy.overrides]]
module = ["leb128.*", "numcodecs.*", "numcodecs_combinators.*", "numba.*", "numcodecs_context_mixing.*", "numcodecs_mask.*"]
follow_untyped_imports = true

[tool.uv.sources]
numcodecs-context-mixing = { git = "https://github.com/SF-N/numcodecs-context-mixing" }
# until https://github.com/juntyr/numcodecs-mask/pull/4 (MaskAwareCodecMixin) is released
numcodecs-mask = { git = "https://github.com/SF-N/numcodecs-mask", branch = "mask-aware-codecs" }
